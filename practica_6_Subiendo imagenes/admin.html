<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Categorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#1a73e8;--danger:#ef4444;--bg:#f0f2f5;}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);padding:20px;}
        .admin-container{max-width:800px;margin:auto;background:white;padding:30px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.05);}
        h1{font-weight:800;margin-bottom:25px;color:#0f172a;}
        input, textarea, select {
            width:100%; padding:14px; border-radius:12px; border:1px solid #ddd; 
            margin-bottom:15px; font-family:inherit; box-sizing: border-box;
        }
        button{width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; cursor:pointer; font-weight:600;}
        .item{display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:15px; border-radius:16px; margin-bottom:10px; border:1px solid #e2e8f0;}
        img{width:60px; height:60px; border-radius:10px; object-fit:cover;}
        .delete{background:#fee2e2; color:var(--danger); width:auto; padding:8px 15px;}
        .badge{background:#e2e8f0; padding:4px 8px; border-radius:6px; font-size:0.75rem; text-transform:uppercase;}
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Panel de Control</h1>
    <form id="productForm">
        <input type="text" id="nombre" placeholder="Nombre del producto" required>
        <textarea id="descripcion" placeholder="Descripción breve"></textarea>
        <input type="number" id="precio" placeholder="Precio ($)" required>
        
        <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="electronica">Electrónica</option>
            <option value="ropa">Ropa</option>
            <option value="hogar">Hogar</option>
        </select>

        <input type="file" id="foto" accept="image/*" multiple required>
        <button type="submit" id="btnPublicar">Publicar Producto</button>
    </form>
    <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">
    <div id="lista"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCfiFNastJGZzhzD4rceW6wN3_E8fxUFpg",
    authDomain: "e-commerce-1db3e.firebaseapp.com",
    projectId: "e-commerce-1db3e",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLOUD_NAME = "da5bwh0fx";
const UPLOAD_PRESET = "e-commerce";

const form = document.getElementById("productForm");
const lista = document.getElementById("lista");

async function cargarProductos(){
    const q = query(collection(db,"productos"), orderBy("fecha","desc"));
    const snap = await getDocs(q);
    lista.innerHTML = "";

    snap.forEach(docu => {
        const p = docu.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div style="display:flex;gap:15px;align-items:center;">
                <img src="${p.imagenes?.[0] || 'https://via.placeholder.com/60'}">
                <div>
                    <strong style="display:block;">${p.nombre}</strong>
                    <span class="badge">${p.categoria || 'Sin cat.'}</span>
                    <div style="color:var(--primary); font-weight:600;">$${p.precio}</div>
                </div>
            </div>
        `;
        const btn = document.createElement("button");
        btn.innerText = "Eliminar";
        btn.className = "delete";
        btn.onclick = async() => {
            if(confirm("¿Eliminar producto?")) {
                await deleteDoc(doc(db,"productos",docu.id));
                cargarProductos();
            }
        };
        div.appendChild(btn);
        lista.appendChild(div);
    });
}

form.onsubmit = async(e) => {
    e.preventDefault();
    const btn = document.getElementById("btnPublicar");
    btn.innerText = "Subiendo...";
    btn.disabled = true;

    const files = document.getElementById("foto").files;
    let imagenes = [];

    for (let i = 0; i < files.length; i++) {
        const formData = new FormData();
        formData.append("file", files[i]);
        formData.append("upload_preset", UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:"POST", body:formData });
        const data = await res.json();
        imagenes.push(data.secure_url);
    }

    await addDoc(collection(db,"productos"), {
        nombre: document.getElementById("nombre").value,
        descripcion: document.getElementById("descripcion").value,
        precio: Number(document.getElementById("precio").value),
        categoria: document.getElementById("categoria").value,
        imagenes: imagenes,
        fecha: serverTimestamp()
    });

    form.reset();
    btn.innerText = "Publicar Producto";
    btn.disabled = false;
    cargarProductos();
};

cargarProductos();
</script>
</body>
</html>
