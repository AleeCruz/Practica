<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Pro 10 Imágenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="carousel-container">
        <div class="carousel-track" id="track">
            <div class="slide"><img src="https://picsum.photos/800/400?random=1" alt="Imagen 1"><div class="caption">Exploración 01</div></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=2" alt="Imagen 2"><div class="caption">Aventura 02</div></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=3" alt="Imagen 3"><div class="caption">Naturaleza 03</div></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=4" alt="Imagen 4"><div class="caption">Ciudad 04</div></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=5" alt="Imagen 5"><div class="caption">Mar 05</div></div>
            </div>

        <button class="btn prev" id="prevBtn">❮</button>
        <button class="btn next" id="nextBtn">❯</button>

        <div class="dots-container" id="dotsContainer"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
